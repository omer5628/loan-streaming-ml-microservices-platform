events { }

http {
    upstream flask_app {
        server web1:8000;
        server web2:8000;
        # Round-robin load balancing between the two Flask UI instances.
    }

    upstream aggregator_app {
        server aggregator:8001;
        # Single upstream for the aggregator microservice.
    }

    server {
        listen 80;

        # Global aggregates and dynamic segments are both handled
        # by the aggregator microservice.
        location /aggregates {
            proxy_pass http://aggregator_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /segments {
            proxy_pass http://aggregator_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All other paths go to the main Flask UI (web1 + web2)
        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
