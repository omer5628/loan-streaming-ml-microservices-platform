services:
  # --------------------------------------------------------------------------
  # Message broker: RabbitMQ (with management UI)
  # --------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"      # AMQP port for Celery / apps
      - "15672:15672"    # Web UI for RabbitMQ management
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # Relational database: PostgreSQL
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"      # optional local access for psql / pgAdmin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --------------------------------------------------------------------------
  # One-time DB initializer – creates tables before other services start
  # --------------------------------------------------------------------------
  db_init:
    build: .
    command: python db_init.py
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Celery worker – runs the ML model and writes results into Postgres
  # --------------------------------------------------------------------------
  celery_worker:
    build: .
    command: celery -A worker worker --loglevel=info
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully

  # --------------------------------------------------------------------------
  # Producer – streams the loan CSV into the system via Celery/RabbitMQ
  # --------------------------------------------------------------------------
  producer:
    build: .
    command: python producer.py
    env_file: .env
    environment:
      PRODUCER_SLEEP_SECONDS: 5
      DATA_CSV_PATH: data/loan_data.csv
      SCHEMA_PATH: models/schema.json
    depends_on:
      rabbitmq:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
      celery_worker:
        condition: service_started

  # --------------------------------------------------------------------------
  # Flask UI instances (2) – behind Nginx load balancer
  # --------------------------------------------------------------------------
  web1:
    build: .
    command: python app.py
    env_file: .env
    depends_on:
      db_init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web2:
    build: .
    command: python app.py
    env_file: .env
    depends_on:
      db_init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Aggregator – computes aggregated statistics over the prediction table
  # --------------------------------------------------------------------------
  aggregator:
    build: .
    command: python aggregator.py
    env_file: .env
    depends_on:
      db_init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Nginx – reverse proxy and load balancer (web1 + web2 + aggregator)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web1
      - web2
      - aggregator
    ports:
      - "8000:80"    # host:8000 -> nginx:80 -> Flask UI / Aggregator
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

# ----------------------------------------------------------------------------
# Named volumes for persistent services
# ----------------------------------------------------------------------------
volumes:
  rabbitmq_data:
  pgdata:
